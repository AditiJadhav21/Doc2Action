AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: AI Document to Action Assistant

Parameters:
BedrockModelId:
Type: String
Default: amazon.nova-lite-v1:0
Description: A Bedrock Converse API model ID enabled in this AWS Region.

Globals:
Function:
Runtime: python3.12
CodeUri: backend/
Timeout: 60
MemorySize: 512
Environment:
Variables:
TABLE_NAME: !Ref DocumentsTable
BUCKET_NAME: !Ref DocumentsBucket
BEDROCK_MODEL_ID: !Ref BedrockModelId
ALLOWED_ORIGIN: '*'

Resources:

DocumentsBucket:
Type: AWS::S3::Bucket
Properties:
CorsConfiguration:
CorsRules:
- AllowedHeaders:
- '*'
AllowedMethods:
- GET
- PUT
- POST
AllowedOrigins:
- '*'
MaxAge: 3000

```
  PublicAccessBlockConfiguration:
    BlockPublicAcls: true
    IgnorePublicAcls: true
    BlockPublicPolicy: true
    RestrictPublicBuckets: true
```

DocumentsTable:
Type: AWS::DynamoDB::Table
Properties:
BillingMode: PAY_PER_REQUEST

```
  AttributeDefinitions:
    - AttributeName: documentId
      AttributeType: S

  KeySchema:
    - AttributeName: documentId
      KeyType: HASH
```

UploadUrlFunction:
Type: AWS::Serverless::Function
Properties:
Handler: app.get_upload_url

```
  Policies:
    - S3WritePolicy:
        BucketName: !Ref DocumentsBucket

    - DynamoDBCrudPolicy:
        TableName: !Ref DocumentsTable

  Events:
    UploadUrl:
      Type: Api
      Properties:
        Path: /upload-url
        Method: post
```

ProcessFunction:
Type: AWS::Serverless::Function
Properties:
Handler: app.start_document_processing

```
  Policies:
    - S3ReadPolicy:
        BucketName: !Ref DocumentsBucket

    - DynamoDBCrudPolicy:
        TableName: !Ref DocumentsTable

    - Statement:
        - Effect: Allow
          Action:
            - textract:StartDocumentTextDetection
          Resource: '*'

  Events:
    Process:
      Type: Api
      Properties:
        Path: /process
        Method: post
```

ResultFunction:
Type: AWS::Serverless::Function
Properties:
Handler: app.get_document_result
Timeout: 120

```
  Policies:
    - DynamoDBCrudPolicy:
        TableName: !Ref DocumentsTable

    - Statement:
        - Effect: Allow
          Action:
            - textract:GetDocumentTextDetection
            - bedrock:InvokeModel
          Resource: '*'

  Events:
    Result:
      Type: Api
      Properties:
        Path: /result/{documentId}
        Method: get
```

Outputs:

ApiUrl:
Description: API Gateway base URL for the frontend
Value: !Sub
- 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
- {}

DocumentsBucketName:
Description: S3 bucket used for uploaded documents
Value: !Ref DocumentsBucket
